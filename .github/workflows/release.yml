name: Release

# Run from the Actions tab: picks the next vX.Y.Z from the latest tag (or takes
# an exact version), tags the selected commit on main, publishes a GitHub
# release with generated notes, and starts the image build for the new tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version instead (e.g. 1.0.0); overrides bump
        type: string
        required: false

permissions:
  contents: write # push the tag, create the release
  actions: write # start the image workflow

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main; this run is on ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          latest="${latest:-v0.0.0}"
          if [ -n "$EXPLICIT" ]; then
            next="${EXPLICIT#v}"
            if ! [[ "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::'$EXPLICIT' is not a version like 1.2.3."
              exit 1
            fi
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="${major}.$((minor + 1)).0" ;;
              *)     next="${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then
            echo "::error::Tag v${next} already exists."
            exit 1
          fi
          echo "Latest tag: ${latest}; releasing v${next}"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "previous=${latest}" >> "$GITHUB_OUTPUT"

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [ "$PREVIOUS" != "v0.0.0" ]; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$TAG" "${args[@]}"

      # Tags pushed with the workflow token don't trigger other workflows, so
      # start the image build for the new tag explicitly.
      - name: Build and publish the image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run image.yml --ref "$TAG" -f version="$TAG"
          echo "Image build started for $TAG: ghcr.io/${GITHUB_REPOSITORY}:${TAG#v}" >> "$GITHUB_STEP_SUMMARY"
